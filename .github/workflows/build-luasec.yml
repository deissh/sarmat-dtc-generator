# Builds LuaSec for the DCS GUI Lua (Lua 5.1 x64, bin\lua.dll) with OpenSSL linked statically and
# commits Scripts/SarmatDTC/lib (ssl.dll, ssl.lua, cacert.pem, licenses, VERSIONS.txt) to the branch.
# The committed lib/ is final: this runs only by hand (Actions -> build-luasec -> Run workflow),
# to reproduce ssl.dll from the pinned sources. Releases (release.yml) use the committed files.
name: build-luasec

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-luasec-${{ github.ref }}
  cancel-in-progress: true

env:
  LUA_VERSION: 5.1.5
  LUA_SHA256: 2640fc56a795f29d28ef15e13c34a47e223960b0240e8cb0a82d9b0738695333
  LUASEC_ROCK: luasec-1.3.2-1.src.rock
  LUASEC_SHA256: f93bf9927bd34a5d4f897f4488b285a12bee89c0e7d54b3b36dfcbf43a7ad4e5
  LUA_DLL: lua            # import name: ssl.dll must bind to DCS's bin\lua.dll

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: OpenSSL (static, vcpkg)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install openssl:x64-windows-static
          if ($LASTEXITCODE) { exit 1 }

      - name: Sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force src | Out-Null
          curl.exe -fsSL --retry 3 -o src\lua.tar.gz "https://www.lua.org/ftp/lua-$env:LUA_VERSION.tar.gz"
          curl.exe -fsSL --retry 3 -o src\luasec.zip "https://luarocks.org/$env:LUASEC_ROCK"
          curl.exe -fsSL --retry 3 -o src\cacert.pem "https://curl.se/ca/cacert.pem"
          if ((Get-FileHash src\lua.tar.gz -Algorithm SHA256).Hash -ne $env:LUA_SHA256) { throw 'lua sha256 mismatch' }
          if ((Get-FileHash src\luasec.zip -Algorithm SHA256).Hash -ne $env:LUASEC_SHA256) { throw 'luasec sha256 mismatch' }
          tar -xzf src\lua.tar.gz -C src
          Expand-Archive src\luasec.zip -DestinationPath src\luasec-rock
          Get-ChildItem src, src\luasec-rock

      - name: Build lua.dll (import library only) and ssl.dll
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set VS=%%i
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set OSSL=%VCPKG_INSTALLATION_ROOT%\installed\x64-windows-static
          set LUASRC=%CD%\src\lua-%LUA_VERSION%\src
          set SEC=%CD%\src\luasec-rock\luasec
          mkdir build\lua build\sec
          cd build\lua
          cl /nologo /O2 /MT /Brepro /DLUA_BUILD_AS_DLL /c "%LUASRC%\*.c" || exit /b 1
          del lua.obj luac.obj print.obj
          link /nologo /Brepro /DLL /OUT:%LUA_DLL%.dll *.obj || exit /b 1
          cl /nologo /O2 /MT /Brepro /DLUA_BUILD_AS_DLL "%LUASRC%\lua.c" /Fe:lua.exe %LUA_DLL%.lib || exit /b 1
          cd ..\sec
          cl /nologo /O2 /MT /Brepro /DWIN32 /DNDEBUG /D_WINDOWS /D_USRDLL /DLSEC_EXPORTS /DBUFFER_DEBUG ^
             /DWITH_LUASOCKET /DLUASOCKET_DEBUG /DLUASEC_INET_NTOP /DWINVER=0x0501 /D_WIN32_WINNT=0x0501 ^
             /DNTDDI_VERSION=0x05010300 /I"%LUASRC%" /I"%OSSL%\include" /I"%SEC%\src" /I"%SEC%\src\luasocket" ^
             /c "%SEC%\src\options.c" "%SEC%\src\config.c" "%SEC%\src\ec.c" "%SEC%\src\x509.c" ^
             "%SEC%\src\context.c" "%SEC%\src\ssl.c" "%SEC%\src\luasocket\buffer.c" "%SEC%\src\luasocket\io.c" ^
             "%SEC%\src\luasocket\timeout.c" "%SEC%\src\luasocket\wsocket.c" || exit /b 1
          link /nologo /Brepro /DLL /OUT:ssl.dll *.obj ..\lua\%LUA_DLL%.lib "%OSSL%\lib\libssl.lib" "%OSSL%\lib\libcrypto.lib" ^
             ws2_32.lib crypt32.lib advapi32.lib user32.lib gdi32.lib bcrypt.lib || exit /b 1
          dumpbin /nologo /dependents ssl.dll > deps.txt
          type deps.txt
          dumpbin /nologo /exports ssl.dll | findstr luaopen_ssl_

      - name: Check ssl.dll
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $deps = Select-String -Path build\sec\deps.txt -Pattern '^\s+(\S+\.dll)\s*$' | ForEach-Object { $_.Matches[0].Groups[1].Value.ToLower() }
          $allowed = @("$env:LUA_DLL.dll", 'kernel32.dll', 'ws2_32.dll', 'crypt32.dll', 'advapi32.dll', 'user32.dll', 'gdi32.dll', 'bcrypt.dll')
          $extra = $deps | Where-Object { $allowed -notcontains $_ }
          if ($extra) { throw "unexpected dependencies: $extra" }
          Copy-Item build\sec\ssl.dll build\lua\
          Set-Content -Encoding ascii build\lua\smoke.lua @'
          for _, m in ipairs({ 'core', 'context', 'x509', 'config' }) do
              package.preload['ssl.' .. m] = assert(package.loadlib('.\\ssl.dll', 'luaopen_ssl_' .. m))
          end
          local ssl = dofile(arg[1])
          assert(ssl.newcontext({ mode = 'client', protocol = 'any', verify = 'peer', options = 'all', cafile = arg[2] }))
          print('LuaSec ' .. ssl._VERSION .. ' loads, TLS context ok')
          '@
          Push-Location build\lua
          .\lua.exe smoke.lua "$env:GITHUB_WORKSPACE\src\luasec-rock\luasec\src\ssl.lua" "$env:GITHUB_WORKSPACE\src\cacert.pem"
          if ($LASTEXITCODE) { exit 1 }
          Pop-Location
          # the mod's HTTP client with the fake network, in the same interpreter
          build\lua\lua.exe Scripts\SarmatDTC\tests\test_http.lua Scripts\SarmatDTC
          if ($LASTEXITCODE) { exit 1 }

      - name: Collect lib
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lib = 'Scripts\SarmatDTC\lib'
          $ossl = "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows-static"
          New-Item -ItemType Directory -Force $lib | Out-Null
          Copy-Item build\sec\ssl.dll, src\luasec-rock\luasec\src\ssl.lua, src\cacert.pem $lib
          Copy-Item src\luasec-rock\luasec\LICENSE "$lib\LICENSE-LuaSec.txt"
          Copy-Item "$ossl\share\openssl\copyright" "$lib\LICENSE-OpenSSL.txt"
          $openssl = (& "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" list openssl:x64-windows-static | Out-String).Trim()
          $cadate = (Select-String -Path src\cacert.pem -Pattern 'as of: (.*)$' | Select-Object -First 1).Matches[0].Groups[1].Value
          @(
            "LuaSec for SarmatDTC, built by .github/workflows/build-luasec.yml",
            "LuaSec:   $env:LUASEC_ROCK (sha256 $env:LUASEC_SHA256)",
            "OpenSSL:  $openssl (static)",
            "Lua:      $env:LUA_VERSION headers, imports $env:LUA_DLL.dll (DCS bin\$env:LUA_DLL.dll)",
            "cacert:   https://curl.se/ca/cacert.pem, Mozilla data as of $cadate"
          ) | Set-Content -Encoding ascii "$lib\VERSIONS.txt"
          Get-Content "$lib\VERSIONS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: sarmatdtc-lib
          path: Scripts/SarmatDTC/lib

      - name: Commit lib to the branch
        if: github.ref_type == 'branch'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A Scripts/SarmatDTC/lib
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'lib unchanged'; exit 0 }
          git commit -m "lib: LuaSec build ($env:GITHUB_RUN_ID)"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
