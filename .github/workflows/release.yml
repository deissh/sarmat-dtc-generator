# Publishes a GitHub release when a version tag is pushed (git tag v1.2.0 && git push origin v1.2.0).
# The zip is `git archive` of the tag: only tracked files, without the paths marked export-ignore in
# .gitattributes (tests, CI, agent docs), so the cache and config.user.lua never get into it.
# Unzipped into Saved Games\DCS.openbeta it gives Scripts\Hooks\SarmatDTC-hook.lua and Scripts\SarmatDTC.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against VERSION and lib
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(sed -n "s/^local VERSION *= *'\([^']*\)'.*/\1/p" Scripts/SarmatDTC/SarmatDTC.lua)
          if [ "$tag" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION '$version' in SarmatDTC.lua"
            exit 1
          fi
          for f in ssl.dll ssl.lua cacert.pem; do
            test -s "Scripts/SarmatDTC/lib/$f" || { echo "::error::Scripts/SarmatDTC/lib/$f missing"; exit 1; }
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: HTTP client tests
        run: |
          sudo apt-get install -y -qq lua5.1 > /dev/null
          lua5.1 Scripts/SarmatDTC/tests/test_http.lua Scripts/SarmatDTC

      - name: Build zip
        run: |
          zip="SarmatDTC-$VERSION.zip"
          git archive --format=zip -o "$zip" "$GITHUB_REF_NAME"
          unzip -l "$zip"
          sha256sum "$zip" > "$zip.sha256"
          echo "ZIP=$zip" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ZIP" "$ZIP.sha256" \
            --title "SarmatDTC $VERSION" --generate-notes \
            --notes "Распакуйте архив в папку Saved Games\\DCS.openbeta (или Saved Games\\DCS) с объединением папок. Подробности — README.md в архиве."
